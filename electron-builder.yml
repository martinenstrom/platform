# Financial OS — the Windows package.
#
# One per-user installer with a Start Menu entry and a desktop shortcut. The
# application is the built TanStack Start bundle under `dist/` with the
# desktop host under `desktop/`; production dependencies travel with it.
# Unsigned in V1: Windows SmartScreen will ask once.
appId: se.financialos.desktop
productName: Financial OS
copyright: Financial OS
directories:
  output: release
  buildResources: build
# Only what the running application needs: the host's four runtime modules,
# the built application, the icon and the package identity. Probes, tests
# and the packaging tooling stay out, so a change to them never changes the
# archive — and so the package carries no data, no backups, no configuration.
files:
  - desktop/main.mjs
  - desktop/paths.mjs
  - desktop/preload.cjs
  - desktop/serve.mjs
  - dist/**/*
  - build/icon.png
  - package.json
  - '!**/*.map'
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  # A prebuilt multi-size .ico (made once from build/icon.png with electron-builder's
  # own icon toolset): the runner then converts nothing, downloads no toolset and
  # spawns no node child for it — one failure point fewer, and the same bytes every build.
  icon: build/icon.ico
  artifactName: Financial-OS-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Financial OS
  runAfterFinish: false
  deleteAppDataOnUninstall: false
